name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node scripts/check-syntax.mjs
      # npm test 指向 scripts/run-tests.mjs：自己枚举测试文件，避免 Windows 上通配符不展开（CI 曾因此假失败）
      - name: Unit tests (cross-platform launcher)
        run: npm test

      - name: Co-op self-check (模型画像 → 注入 → 指标 → status/doctor)
        run: node scripts/e2e-coop.mjs

      - name: Subagent injection self-check (subagentInject 开关)
        run: node scripts/e2e-subagent.mjs

      - name: Installer script syntax (bash)
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n test/install-sh-smoke.sh
          bash -n test/install-deps-smoke.sh
          bash -n test/install-fail-smoke.sh
          for f in *.command; do bash -n "$f"; done

      - name: install.sh smoke test (macOS/Linux 一键安装)
        run: bash test/install-sh-smoke.sh

      - name: dependency handling smoke test (--yes / --no-deps / 缺 Node)
        run: bash test/install-deps-smoke.sh

      - name: pnpm failure reporting smoke test
        run: bash test/install-fail-smoke.sh

  # 跨平台 / 跨 Node 版本的基线：代码路径不区分平台，但注入/锁/原子写的行为必须实测。
  cross:
    name: cross ${{ matrix.os }} · node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node scripts/check-syntax.mjs
      - name: Unit tests (cross-platform launcher)
        run: npm test
      - name: Co-op self-check
        run: node scripts/e2e-coop.mjs
      - name: Subagent injection self-check
        run: node scripts/e2e-subagent.mjs
