name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          for f in lib/*.js lib/redteam/*.js bin/*.js client.js test/*.mjs; do
            [ -f "$f" ] && node --check "$f"
          done
      - name: Unit tests
        run: npm test
