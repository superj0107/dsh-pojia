name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --check lib/persona.js
          node --check lib/effect-check.js
          node --check client.js

      - name: Unit tests
        run: npm test

      - name: Verify release notes
        run: |
          version="$(node -p "require('./package.json').version")"
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi

      - name: Build installable tgz
        run: |
          npm pack --pack-destination .
          ls -lh dsh-pojia-*.tgz

      - name: Publish GitHub Release with installable package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          tgz="dsh-pojia-${version}.tgz"
          test -s "$tgz"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$tgz" --clobber
            echo "updated https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          else
            args=(release create "$tag" --title "$tag" --notes-file release-notes.md "$tgz")
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
            echo "published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          fi
