name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --check lib/persona.js
          node --check lib/effect-check.js
          node --check client.js

      - name: Unit tests
        run: npm test

      - name: Verify release notes
        run: |
          version="$(node -p "require('./package.json').version")"
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi

      - name: Build installable tgz and one-click zip
        run: |
          npm pack --pack-destination .
          version="$(node -p "require('./package.json').version")"
          # 一键安装包：解压后运行 install.ps1 即可，不依赖 dsh plugin 命令
          staged="dsh-pojia-${version}-installer"
          mkdir -p "$staged"
          # 用 npm pack 的内容作为插件正文（去掉 package/ 顶层），再附上 install.ps1
          tar -xzf "dsh-pojia-${version}.tgz"
          cp -a package/. "$staged/"
          rm -rf package
          cp install.ps1 "$staged/install.ps1"
          zip -qr "dsh-pojia-${version}-installer.zip" "$staged"
          ls -lh dsh-pojia-*.tgz dsh-pojia-*-installer.zip

      - name: Publish GitHub Release with installable package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          tgz="dsh-pojia-${version}.tgz"
          zip="dsh-pojia-${version}-installer.zip"
          test -s "$tgz"
          test -s "$zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$tgz" "$zip" --clobber
            echo "updated https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          else
            args=(release create "$tag" --title "$tag" --notes-file release-notes.md "$tgz" "$zip")
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            gh "${args[@]}"
            echo "published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          fi
